<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anpig IR System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        input[type="text"] { transition: all 0.3s; }
        input[type="text"]:focus { box-shadow: 0 0 8px rgba(70, 140, 250, 0.8); }
        input::placeholder { font-style: italic; }
    </style>
</head>
<body>
    <div class="search-container">
        <h1 class="mb-2 text-center">Anpig IR System</h1>
        <p class="text-center text-muted mb-4">
            Search ophthalmology articles and studies indexed from <strong>www.anpig.it</strong>
        </p>
        <form action="/search" method="post" class="d-flex">
            <input type="text" name="query" class="form-control form-control-lg"
                   placeholder="Enter your query..." required>
            <button type="submit" class="btn btn-primary ms-2 px-4">Search</button>
        </form>
    </div>
</body>
</html>
